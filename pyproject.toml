[project]
name = "projeto-cd"
version = "0.2.0"
description = "Pipeline de recomendação de jogos Steam com análise exploratória, testes estatísticos e modelos preditivos"
authors = [
    {name = "914joseph",email = "jfsj2@ic.ufal.br"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "xgboost (>=3.2.0,<4.0.0)",
    "shap (>=0.52.0,<0.53.0)",
    "scikit-learn (>=1.9.0,<2.0.0)"
]

[project.scripts]
pipeline = "projeto_cd.main:main"

[tool.poetry]
packages = [{include = "projeto_cd", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
